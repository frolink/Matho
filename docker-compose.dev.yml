version: '3.9'

# Infra-only stack for local development — run `npm run dev` on the host
# against these, instead of containerizing the apps too:
#   docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: matho-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matho_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-matho_dev}
    ports:
      - '5432:5432'
    volumes:
      - matho_postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: matho-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  matho_postgres_dev_data:
