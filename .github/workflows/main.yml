name: MATHO CI

on:
  workflow_dispatch:

jobs:
  prisma:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Check generated files
        run: |
          echo "=== GENERATED ==="
          ls -R packages/database/generated || true

      - name: Check exports
        run: |
          echo "=== INDEX ==="
          cat packages/database/src/index.ts

      - name: Check client
        run: |
          echo "=== CLIENT ==="
          ls packages/database/generated/client || true
