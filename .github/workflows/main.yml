name: MATHO CI

on:
  workflow_dispatch:

jobs:
  api-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm --workspace=@matho/database run generate

      - name: Check Prisma Generated Client
        run: |
          echo "=== DATABASE PACKAGE ==="
          ls -la packages/database

          echo "=== GENERATED ==="
          ls -R packages/database/generated || true

      - name: Check Database Exports
        run: |
          echo "=== DATABASE INDEX ==="
          cat packages/database/src/index.ts

          echo "=== DATABASE CLIENT ==="
          cat packages/database/src/client.ts

      - name: Build API
        run: npm --workspace=@matho/api run build

      - name: Find Build Output
        run: |
          echo "=== SEARCH DIST ==="
          find . -type d -name dist

          echo "=== SEARCH MAIN JS ==="
          find . -type f -name main.js

      - name: Check API Build Output
        run: |
          echo "=== API DIST ==="
          ls -R apps/api/dist || true

      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: matho-api-build
          path: |
            apps/api/**
            packages/database/**
            package.json
            package-lock.json
