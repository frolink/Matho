name: Build MATHO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - run: npm run db:generate

      - run: ls -R packages/database/generated || true

      - run: grep -n "UserRole" packages/database/generated/client/index.d.ts || true

      - run: sed -n '1,40p' apps/api/src/modules/auth/auth.types.ts

      - run: npm run build
