source:
  url: https://github.com/frolink/Matho.git
  type: clone
  shallow: true

features:
  - node lts
  - postgresql

nginx:
  passenger:
    enabled: on
    app_start_command: npm --workspace=@matho/api run start
    app_root: .

commands:
  - cd $HOME && npm install --ignore-scripts --no-audit --no-fund
  - cd $HOME && npm run db:generate
  - cd $HOME && npx turbo run build --filter=@matho/api
