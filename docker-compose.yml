version: '3.9'

# MATHO — local development stack.
# `docker compose up` boots Postgres, Redis, the API, and both web apps.
# The Postgres/Redis services are also useful standalone while running
# `npm run dev` on the host for faster local iteration.

services:
  postgres:
    image: postgres:16-alpine
    container_name: matho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matho_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-matho_dev}
    ports:
      - '5432:5432'
    volumes:
      - matho_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-matho}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: matho-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - matho_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: matho-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-matho}:${POSTGRES_PASSWORD:-matho_dev_password}@postgres:5432/${POSTGRES_DB:-matho_dev}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3002
      PORT: 4000
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: matho-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: matho-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3002:3002'

volumes:
  matho_postgres_data:
  matho_redis_data:
