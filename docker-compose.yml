version: '3.9'

# MATHO — one-command local/production-style stack.
# `docker compose up --build` boots Postgres, Redis, runs database
# migrations once, then starts the API and both web apps.
#
# Beginner-friendly quick start — see docs/DEPLOYMENT.md for the full guide:
#   1. cp .env.example .env        (edit JWT_SECRET before real deployments)
#   2. docker compose up --build
#   3. Open http://localhost:3000  (web)  and  http://localhost:3002  (admin)

services:
  postgres:
    image: postgres:16-alpine
    container_name: matho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matho_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-matho_dev}
    ports:
      - '5432:5432'
    volumes:
      - matho_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-matho}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: matho-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - matho_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job: syncs the Prisma schema to Postgres, then exits. `api`
  # waits for this to finish successfully before it starts — so the
  # database schema is always up to date on every `docker compose up`.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: matho-migrate
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-matho}:${POSTGRES_PASSWORD:-matho_dev_password}@postgres:5432/${POSTGRES_DB:-matho_dev}?schema=public
    working_dir: /repo
    # NOTE: this repo has no Prisma migration history yet (Phase 1 foundation).
    # `db push` syncs the schema directly — safe for first deploys. Once you've
    # run `npm run db:migrate` locally to create a real migration, switch this
    # to `npm run db:migrate:deploy` instead. See docs/DEVELOPER_GUIDE.md.
    command: sh -c "npm run db:push && npm run db:seed"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: matho-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-matho}:${POSTGRES_PASSWORD:-matho_dev_password}@postgres:5432/${POSTGRES_DB:-matho_dev}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      PI_API_BASE_URL: ${PI_API_BASE_URL:-https://api.minepi.com/v2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3002}
      PORT: 4000
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle at BUILD time — must be the URL
        # your browser can actually reach (a real domain in production).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_PI_SANDBOX: ${NEXT_PUBLIC_PI_SANDBOX:-true}
    container_name: matho-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Server-side (Route Handlers) → reach the API over the Docker network.
      API_INTERNAL_URL: http://api:4000
    ports:
      - '3000:3000'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: matho-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    ports:
      - '3002:3002'

volumes:
  matho_postgres_data:
  matho_redis_data:
